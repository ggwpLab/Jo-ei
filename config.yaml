server:
  listen: ":8080"
  # Max concurrent in-flight requests to each upstream registry host (metadata,
  # transparent proxy and artifact downloads combined). Default 6 when unset.
  upstream_max_concurrent: 6
  # Max request *rate* per upstream registry host (token bucket, burst = 2x).
  # Registries throttle by rate, not concurrency, so this is the primary defense
  # against HTTP 429. Default 10 when unset; raise for a large shared instance.
  upstream_rate_per_second: 10
  # Max decompressed size (MB) of an npm metadata document the proxy will
  # buffer to hide policy-blocked versions from it, so the resolver lands on
  # one the policy allows instead of failing the whole install. Default 32
  # when unset; set to 0 to disable metadata filtering entirely.
  metadata_filter_max_mb: 32
  # Largest package artifact (wheel, tarball, jar, gem, module zip) the proxy
  # downloads, in MB; a larger one is refused with 403 artifact_too_large
  # before it can fill the cache volume. Default 2048 — the ClamAV stream limit
  # the compose file sets, so anything bigger could not be scanned anyway.
  # 0 = unlimited. (Docker layers use image_scan.max_layer_bytes.)
  max_artifact_mb: 2048
  # Seconds a stopping server waits for in-flight requests (a gated download
  # can take a while) before closing the rest. Keep it below the container's
  # stop grace period (docker-compose.yaml: stop_grace_period). Default 30.
  shutdown_timeout_seconds: 30
  # Reverse proxies (CIDRs or bare IPs) whose forwarding header is trusted for the
  # client IP used by login rate limits. Empty = use the TCP peer address —
  # behind a reverse proxy that is the proxy's own address, so every client
  # shares one login-throttling bucket. List only the address your reverse
  # proxy connects from, never a whole network: anyone else connecting from a
  # trusted address can forge the header. See README "Running in Production".
  # Settable from the environment, comma- or space-separated:
  # JOEI_SERVER_TRUSTED_PROXIES="172.30.0.10,10.0.0.5".
  trusted_proxies: []
  # Header read from a trusted proxy: X-Forwarded-For (default), X-Real-IP or Forwarded.
  client_ip_header: "X-Forwarded-For"

# Extra certificate authorities trusted when connecting to upstream registries.
# Use this when a mirror presents a corporate or self-signed certificate: the
# listed PEM files are added to the system root pool, so public registries keep
# working alongside it. A file that cannot be read or parsed stops startup.
# tls:
#   ca_files:
#     - /etc/jo-ei/ca/corp-root.pem

registries:
  pypi:
    upstreams:
      - "https://pypi.org"
    enabled: true
  npm:
    upstreams:
      - "https://registry.npmjs.org"
    enabled: true
  maven:
    upstreams:
      - "https://repo1.maven.org/maven2"
      - "https://maven-central.storage-download.googleapis.com/maven2"
    enabled: true
  rubygems:
    upstreams:
      - "https://rubygems.org"
    enabled: true
  go:
    upstreams:
      - "https://proxy.golang.org"
    enabled: false   # opt-in; Go module pull-through proxy (GOPROXY=http://<jo-ei>/go)
  docker:
    upstreams:
      - "https://registry-1.docker.io"
    enabled: true   # opt-in; flip to false to disable the Docker pull-through proxy

supply_chain:
  min_age_hours: 24
  mode: "enforce"

cve:
  enabled: true
  base_url: "https://api.osv.dev"
  block_on: "HIGH"
  cache_ttl_minutes: 1440

# Container-image vulnerability scanning (Trivy). Separate from the osv.dev CVE
# scanner above: a different engine and model. Severity threshold and denylist
# come from the active policy profile (cve_min_severity / denylist).
image_scan:
  enabled: true
  trivy_server: "http://trivy:4954"
  timeout_seconds: 120
  scanners: "vuln,secret"
  max_layer_bytes: 2147483648   # 2 GB; a larger layer fails closed (blocks the image)

malware:
  # Cap simultaneous scans so download bursts don't overwhelm the engines'
  # worker pools and make clamd/ICAP responses time out. 0 = default (8),
  # roughly clamd's default thread pool. Raise it if you tuned clamd MaxThreads.
  max_concurrent_scans: 8
  scanners:
    - type: clamav
      # clamav/clamav image listens on TCP 3310 by default; its unix socket
      # lives at /tmp/clamd.sock inside its own container and is not shareable.
      address: "tcp:clamav:3310"
      # Generous on purpose: clamd needs minutes for a multi-GB artifact or
      # layer, and a timeout fails the download closed (503).
      timeout_seconds: 300
    # Add a commercial engine over ICAP (Kaspersky, Dr.Web, …):
    # Each scanner is reported (detections, logs, console overview) under
    # `name`; it defaults to the type, or "icap:<service>" for ICAP. Names must
    # be unique, so give several engines of one type distinct names.
    # - type: icap
    #   name: kaspersky
    #   address: "tcp:kaspersky-icap:1344"
    #   service: "avscan"
    #   timeout_seconds: 30

# Scanner health probes (optional). Surfaced in the console overview.
# health:
#   probe_interval_seconds: 30   # how often socket scanners (clamd/ICAP) are probed
#   slow_threshold_ms: 2000      # latency above which a scanner shows "warn"

cache:
  backend: "local"
  local:
    path: "/var/cache/jo-ei"
    max_size_gb: 100
    # Entries not requested for this long count as stale: the console shows
    # them as reclaimable and its Clean up button deletes them. Verdict
    # freshness is handled separately by lazy re-validation (below).
    stale_after_days: 30
  # S3 backend is reserved for a future release; setting backend: s3 currently
  # fails fast at startup.
  # s3:
  #   endpoint: "https://s3.amazonaws.com"
  #   bucket: "joei-cache"
  #   region: "us-east-1"
  # Lazy re-validation: a cache hit whose CVE or malware check is older than
  # its TTL re-runs that gate (CVE by metadata, malware by re-scanning the
  # cached file; Docker re-runs the full image gate) before serving. An entry
  # that now fails is blocked and its binary evicted. A temporarily
  # unreachable scanner serves the previously clean entry and retries on the
  # next hit. 0 disables that gate's re-check.
  revalidation:
    cve_ttl_minutes: 1440
    malware_ttl_minutes: 1440

# Persistent state (required). Telemetry — event history, lifetime counters and
# per-day metrics — is stored in an embedded SQLite database and is the single
# source of truth. The path must be set; the proxy fails to start without it.
database:
  path: "/var/lib/jo-ei/jo-ei.db"
  event_retention_days: 30    # prune persisted events older than this
  daily_retention_days: 365   # prune per-day metric rows older than this

# Profile allowlists seed BOTH runtime per-gate lists (supply-chain age hold
# and CVE block). Per-gate edits live in the console and persist to the DB.
policy:
  active_profile: "production"
  profiles:
    dev:
      cve_block: false
      supply_chain_block: false
      allowlist: []
      denylist: []
    staging:
      cve_block: true
      cve_min_severity: "HIGH"
      supply_chain_block: true
      allowlist: []
      denylist: []
    production:
      cve_block: true
      cve_min_severity: "HIGH"
      supply_chain_block: true
      malware_block: true
      allowlist: []
      denylist: []

logging:
  level: "info"
  format: "json"
  output: "stdout"

# Admin console / API authentication (JWT sessions).
# Users live in the database and are managed on the console Users page. On
# first start, with an empty users table, Jōei creates user "admin" with a
# random temporary password and logs it once (warn line "created initial admin
# user"); sign in with it and choose a new one. Lost it, or locked out? Run
#   jo-ei --config <this file> reset-admin-password
# Without at least one enabled user, /api/ returns HTTP 503 (fail-closed); the
# console shell at /console/ still loads so its login screen can render.
# console:
#   auth:
#     # HS256 key signing console sessions, at least 32 bytes. Prefer the
#     # JOEI_CONSOLE_JWT_SECRET env var. Left unset, Jōei generates one on
#     # first boot and persists it in the database, so sessions survive a
#     # restart; set it explicitly to share sessions across replicas.
#     jwt_secret: "REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES"
#     access_ttl_minutes: 15  # access-token lifetime
#     refresh_ttl_hours: 168  # refresh-token lifetime (7 days)

# Prometheus metrics on a separate listener reachable only by monitoring.
# Do not publish this port to proxy clients. See docs/metrics.md.
metrics:
  enabled: true
  listen: ":9464"
  path: "/metrics"
